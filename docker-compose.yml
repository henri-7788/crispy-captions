services:
  crispy-captions:
    build: .
    container_name: crispy-captions
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - NODE_ENV=production
      - PORT=3001
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3001/api/health', r => process.exit(r.statusCode === 200 ? 0 : 1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  # Optional: Cloudflare Tunnel (Token in .env eintragen → CLOUDFLARE_TUNNEL_TOKEN)
