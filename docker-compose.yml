services:
  crispy-captions:
    build: .
    container_name: crispy-captions
    restart: unless-stopped
    ports:
      - "127.0.0.1:3001:3001"
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET muss gesetzt sein}
      - ADMIN_EMAIL=${ADMIN_EMAIL:-}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-}
      - NODE_ENV=production
      - PORT=3001
      # Port ist nur auf 127.0.0.1 gebunden → Zugriff von außen läuft über einen Reverse-Proxy
      - TRUST_PROXY=${TRUST_PROXY:-1}
      - MAX_TRANSCRIPTIONS_PER_DAY=${MAX_TRANSCRIPTIONS_PER_DAY:-30}
      - MAX_CONCURRENT_RENDERS=${MAX_CONCURRENT_RENDERS:-2}
      - MAX_FILE_SIZE_MB=${MAX_FILE_SIZE_MB:-500}
      - JWT_EXPIRES_IN=${JWT_EXPIRES_IN:-7d}
    volumes:
      - crispy-data:/app/data
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3001/api/health', r => process.exit(r.statusCode === 200 ? 0 : 1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

volumes:
  crispy-data:
